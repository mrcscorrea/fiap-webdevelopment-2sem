<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkpoint 3 - Web Dev</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <h1 class="flex items-center justify-center font-sans text-xl font-bold">Meu Carrinho</h1>

    <div class="py-5 flex items-center justify-center">
        <input type="number" id="num1" placeholder="Digite o valor..." class="rounded border-gray-500 px-2 bg-gray-100" />
        <div class="px-2"></div>
        <input type="qtd" id="num2" placeholder="Digite a quantidade..." class="rounded border-gray-500 px-2 bg-gray-100" />
    </div>
    <div class="py-4 flex items-center justify-center">
        <button class="border rounded border-purple-500 bg-purple-600 px-4 font-mono text-white font-bold" onclick="calcular()"> Calcular</button>
    </div>
    <p id='resultado' class="flex items-center justify-center py-10 font-mono text-xl">Resultado: </p>

    <script src="js/script.js"></script>
</body>

</html>
